# ──────────────────────────────────────────────────────
# Stacklyst — Docker Compose (Development)
#
# Usage:
#   1. cp .env.docker.example .env.docker
#   2. Edit .env.docker with your values (Supabase keys, etc.)
#   3. docker compose up
#
# Hot-reload is enabled: edit your source code and
# changes will reflect automatically in the browser.
# ──────────────────────────────────────────────────────

services:
  db:
    image: postgres:15-alpine
    container_name: stacklyst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_stacklyst_2024}
      POSTGRES_DB: stacklyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stacklyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:20-alpine
    container_name: stacklyst-web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      # Override DB URLs to point to the local Docker Postgres
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres_stacklyst_2024}@db:5432/stacklyst?schema=public
      DIRECT_URL: postgresql://postgres:${DB_PASSWORD:-postgres_stacklyst_2024}@db:5432/stacklyst?schema=public
    volumes:
      # Bind-mount source code for hot-reload
      - .:/app
      # Anonymous volume to avoid overwriting container's node_modules
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache openssl libc6-compat &&
        npm install &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run dev
      "

volumes:
  postgres_data:
